[versions]
kotlin = "2.4.20"
spw-workshop-api = "0.1.0-dev22"
jaudiotagger = "3.0.1"
sqlite-jdbc = "3.46.1.3"
mp3spi = "1.9.5.4"
vorbisspi = "1.0.3.3"
jflac = "1.5.1"

[libraries]
spw-workshop-api = { group = "com.github.Moriafly", name = "spw-workshop-api", version.ref = "spw-workshop-api" }
jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version.ref = "jaudiotagger" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite-jdbc" }
mp3spi = { group = "com.googlecode.soundlibs", name = "mp3spi", version.ref = "mp3spi" }
vorbisspi = { group = "com.googlecode.soundlibs", name = "vorbisspi", version.ref = "vorbisspi" }
jflac = { group = "org.jflac", name = "jflac-codec", version.ref = "jflac" }

[plugins]
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
