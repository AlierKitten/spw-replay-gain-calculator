name: Build & Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: tag
        run: |
          RAW="${GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (from tag $RAW)"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Sync version into build.gradle.kts
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.tag.outputs.version }}\"/" build.gradle.kts
          echo "Updated version line:"
          grep '^version = ' build.gradle.kts

      - name: Commit version bump back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          if git diff --cached --quiet; then
            echo "build.gradle.kts unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.tag.outputs.version }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin (.spmod)
        run: ./gradlew plugin --no-daemon

      - name: Locate artifact
        id: artifact
        run: |
          FILE=$(ls build/libs/plugin-*.spmod 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::No .spmod artifact found under build/libs/"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          echo "Artifact: $FILE"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$(git rev-list --tags --max-count=2 | tail -n 1)" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${{ steps.tag.outputs.raw }}" ]; then
            RANGE="$PREV_TAG..${{ steps.tag.outputs.raw }}"
          else
            RANGE=""
          fi
          echo "Previous tag: ${PREV_TAG:-<none>}"
          {
            echo "changelog<<EOF"
            if [ -n "$RANGE" ]; then
              git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges
            else
              git log --pretty=format:"- %s (%h)" --no-merges
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.raw }}
          name: Release ${{ steps.tag.outputs.version }}
          draft: true
          prerelease: false
          files: ${{ steps.artifact.outputs.file }}
          body: |
            ## 📝 Change Log
            ${{ steps.changelog.outputs.changelog }}

            ---
            *Auto built with GitHub Actions*
